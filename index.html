<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For My Universe ❤️ Nova</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #090014; /* สีม่วงเข้มมืดโรแมนติก */
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
      user-select: none;
    }

    /* ตัวนับจำนวนครั้งที่จิ้ม */
    .tap-counter {
      position: absolute;
      top: 20px;
      z-index: 10;
      background: rgba(255, 105, 180, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 182, 193, 0.4);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #ffe3e8;
      box-shadow: 0 0 15px rgba(255, 105, 180, 0.3);
      opacity: 0;
      transition: opacity 0.8s ease;
      font-weight: 600;
    }

    /* ละอองคำรอบๆ พื้นหลัง */
    #ambient-words {
      position: absolute;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }

    .ambient-item {
      position: absolute;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      animation: floatAmbient ease-in-out infinite alternate;
      text-shadow: 0 0 8px rgba(255, 105, 180, 0.6);
    }

    /* คอนเทนเนอร์รูปหัวใจตรงกลาง */
    #heart-container {
      position: absolute;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 3;
    }

    /* ข้อความวนในรูปหัวใจ */
    .heart-text {
      position: absolute;
      font-weight: 800;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      text-shadow: 0 0 10px #ff007f, 0 0 20px #ff69b4, 0 0 30px #ff007f;
      opacity: 0;
      will-change: transform, opacity;
    }

    /* ข้อความพลุเมื่อจิ้มหน้าจอ */
    .tap-pop-text {
      position: absolute;
      z-index: 10;
      font-weight: 900;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.2);
      animation: popText 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      text-shadow: 0 0 12px rgba(255, 20, 147, 0.9), 0 0 25px rgba(255, 105, 180, 0.8);
    }

    /* ประกายไฟพลุ */
    .spark {
      position: absolute;
      z-index: 9;
      pointer-events: none;
      border-radius: 50%;
      animation: explode 1.2s ease-out forwards;
    }

    /* ข้อความคำแนะนำลางๆ ด้านล่าง */
    .hint-text {
      position: absolute;
      bottom: 30px;
      z-index: 5;
      font-size: 0.85rem;
      color: #ffb6c1;
      opacity: 0;
      letter-spacing: 2px;
      transition: opacity 1s ease;
      text-shadow: 0 0 10px #ff1493;
      animation: pulse 1.5s infinite alternate;
    }

    /* 🎁 Modal ของขวัญความในใจ */
    #gift-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(9, 0, 20, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: fadeIn 0.5s ease forwards;
    }

    .gift-box {
      font-size: 95px;
      cursor: pointer;
      animation: bounce 1.2s infinite alternate ease-in-out;
      filter: drop-shadow(0 0 25px #ff2e63);
      transition: transform 0.2s;
    }

    .gift-box:active {
      transform: scale(1.2);
    }

    .gift-hint {
      margin-top: 15px;
      font-size: 1.1rem;
      color: #ffb6c1;
      animation: pulse 1.2s infinite alternate;
      font-weight: bold;
    }

    /* ✉️ การ์ดจดหมายความในใจ */
    .letter-card {
      display: none;
      background: linear-gradient(135deg, rgba(255, 192, 203, 0.25), rgba(40, 10, 50, 0.9));
      border: 1.5px solid rgba(255, 182, 193, 0.5);
      padding: 30px 25px;
      border-radius: 25px;
      width: 85vw;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.5);
      animation: popup 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      position: relative;
    }

    .letter-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: #ff7eb3;
      margin-bottom: 15px;
      text-shadow: 0 0 10px #ff2e63;
    }

    .letter-body {
      font-size: 0.98rem;
      line-height: 1.7;
      color: #ffffff;
      margin-bottom: 20px;
      text-align: center;
      white-space: pre-line;
      max-height: 48vh;
      overflow-y: auto;
    }

    /* แถบเลือกจดหมายอ่านซ้ำเมื่อครบ 3 ฉบับ */
    .letter-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .nav-btn {
      background: rgba(255, 105, 180, 0.2);
      border: 1px solid #ff7eb3;
      color: #fff;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .nav-btn.active {
      background: #ff2e63;
      border-color: #ff2e63;
      font-weight: bold;
    }

    .close-btn {
      background: linear-gradient(45deg, #ff2e63, #ff758c);
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 46, 99, 0.6);
    }

    /* Keyframes Animations */
    @keyframes floatAmbient {
      0% { transform: translateY(0px) scale(0.9); opacity: 0.2; }
      100% { transform: translateY(-20px) scale(1.1); opacity: 0.6; }
    }

    @keyframes popText {
      0% {
        transform: translate(-50%, -50%) scale(0.2) rotate(-10deg);
        opacity: 0;
      }
      20% {
        transform: translate(-50%, -50%) scale(1.2) rotate(0deg);
        opacity: 1;
      }
      80% {
        transform: translate(-50%, -120px) scale(1) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -160px) scale(0.8) rotate(5deg);
        opacity: 0;
      }
    }

    @keyframes explode {
      0% {
        transform: translate(-50%, -50%) translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
      }
    }

    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.4; }
      100% { transform: scale(1.02); opacity: 0.9; }
    }

    @keyframes bounce {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-20px) scale(1.1); }
    }

    @keyframes popup {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- ตัวนับจำนวนการจิ้ม -->
  <div class="tap-counter" id="counter">💖 บี๋ๆต้องจิ้มอีก 10 ทีเพื่อเปิดจดหมายฉบับที่ 1/3</div>

  <!-- ละอองคำรอบๆ -->
  <div id="ambient-words"></div>

  <!-- คอนเทนเนอร์หัวใจ -->
  <div id="heart-container"></div>
  <div class="hint-text" id="hint">✨ บี๋ๆจิ้มตรงไหนก็ได้ที่จอนะ ✨</div>

  <!-- 🎁 Modal ของขวัญความในใจ -->
  <div id="gift-modal">
    <div class="gift-box" id="gift-box" onclick="openLetter()">🎁</div>
    <div class="gift-hint" id="gift-hint-text">แตะที่กล่องเพื่อเปิดอ่านความในใจสิ 💕</div>

    <!-- ✉️ จดหมายความในใจ -->
    <div class="letter-card" id="letter-card">
      <div class="letter-nav" id="letter-nav" style="display: none;">
        <button class="nav-btn" onclick="switchLetter(0)" id="nav-0">Letter I</button>
        <button class="nav-btn" onclick="switchLetter(1)" id="nav-1">Letter II</button>
        <button class="nav-btn" onclick="switchLetter(2)" id="nav-2">Letter III</button>
      </div>

      <div class="letter-title" id="letter-title">💌 ความในใจถึงพี่โนวา</div>
      <div class="letter-body" id="letter-body">
        <!-- เนื้อหาจะเปลี่ยนตามฉบับ -->
      </div>
      <button class="close-btn" id="close-btn" onclick="closeModal()">เค้าอ่านแล้วน้า 💕</button>
    </div>
  </div>

  <script>
    const heartContainer = document.getElementById('heart-container');
    const ambientContainer = document.getElementById('ambient-words');
    const hint = document.getElementById('hint');
    const counterEl = document.getElementById('counter');
    const giftModal = document.getElementById('gift-modal');
    const giftBox = document.getElementById('gift-box');
    const giftHintText = document.getElementById('gift-hint-text');
    const letterCard = document.getElementById('letter-card');
    const letterTitle = document.getElementById('letter-title');
    const letterBody = document.getElementById('letter-body');
    const letterNav = document.getElementById('letter-nav');

    let tapCountInCurrentLevel = 0; // ตัวนับของรอบปัจจุบัน
    let currentUnlockedLevel = 0; // 0, 1, 2
    let isModalOpen = false;

    // 🎯 กำหนดเป้าหมายการกดในแต่ละรอบ: รอบแรก 10 ครั้ง, รอบสอง 20 ครั้ง, รอบสาม 40 ครั้ง
    const tapTargets = [10, 20, 40];

    // 💌 ข้อความความในใจทั้ง 3 ฉบับ
    const letters = [
      {
        title: "💌 Letter I: ถึงแฟนคนเก่งคนสวยของเค้า",
        body: `ขอบคุณที่เข้ามาเป็นเรื่องราวดีๆในชีวิตเค้านะบี๋ๆ
ทุกๆวันที่มีบี๋อยู่ข้างๆ มันมีความสุขมากๆเลยย
ขอบคุณที่เข้ามาในชีวิตเค้า มาเป็นความสดใสและคอยสร้างรอยยิ้มให้กับเค้าเสมอนะคะ 💕

"You are my standard of happiness." 👑❤️`
      },
      {
        title: "💖 Letter II: เรื่องที่อยากบอกบี๋ๆ",
        body: `รู้มั้ยว่าบี๋ๆเก่งมากๆ เลยนะ!
ไม่ว่าจะเจอเรื่องเหนื่อยหรือยากแค่ไหน เค้าจะคอยกวนบี๋ๆให้บี๋ๆยิ้มได้! แล้วก็เค้าก็จะภูมิใจในตัวบี๋เสมอ
ถ้าเหนื่อยเมื่อไหร่ หันมาหาเค้าได้ตลอดเลยนะ
เค้าพร้อมจะเป็นเซฟโซนให้บี๋ๆเสมอครับ แล้วก็พร้อมรับฟังบี๋ๆทุกอย่างทุกเรื่องที่บี๋ๆอย่างเล่าเลยย เค้าสัญญาว่าจะรักและดูแลบี๋ให้ดีที่สุด
จะอยู่ข้างๆ คอยซัพพอร์ต และเติมความสุขให้บี๋แบบนี้ทุกๆวันเลย! แม้จะกวนตีนบ้างไม่มากก็น้อยก็เถอะคับบ
แต่ว่า! เค้ารักพี่โนวาที่สุดในโลกเลยนะ! สุดท้ายนี้ ไม่รู้ว่าบี๋ๆจะอ่านข้ามหรือไม่อ่านเลยก็ไม่เป็นไร
เพราะเค้าคงเขียนพิมพ์อะไรๆ มากไปจริงๆ แล้วไอที่เค้าอยากบอกบี๋ๆจริงๆก็คือ...✨`
      },
      {
        title: "👑 Letter III: To the One Who Holds My Heart",
        body: `I love you more than words can say, and I've never felt this way about anyone before. You’re the first person
 I’ve ever loved completely and selflessly—just loving you is enough for me.💕

I LOVE YOU NOVA... ALWAYS & FOREVER 💍💖`
      }
    ];

    // 1. ประโยคที่จะวนในรูปหัวใจ
    const heartPhrases = [
      "I LOVE YOU NOVA",
      "YOU ARE MY EVERYTHING",
      "I LOVE YOU",
      "MY ONE AND ONLY",
      "ALWAYS & FOREVER",
      "NOVA MY LOVE",
      "YOU ARE MY SUNSHINE"
    ];

    // 2. คำลอยรอบๆ พื้นหลัง
    const ambientPhrases = [
      "❤️ NOVA", "FOREVER", "MY LOVE", "YOU & ME",
      "PRECIOUS", "SWEETHEART", "SO MUCH", "INFINITY",
      "MY ALL", "NOVA", "LOVE YOU", "💖","My Favorite girl","N","U BELONG WITH ME",
      "M + N","HONEYBEE","Kitten","ํYOU'R MY ANGEL"
    ];

    // 3. ประโยคที่จะเด้งออกมาเวลาจิ้มหน้าจอ
    const loveMessages = [
      "รักบี๋ๆที่สุด~ 💕",
      "รักที่สุ๊ดดดดด!! 🔥",
      "รักพี่โนวามากๆ! 💖",
      "U my only one 💍",
      "I LOVE YOU NOVA 👑",
      "คนเก่งของเค้า 🥺",
      "คิดถึงบี๋จังเลย ✨",
      "มีพี่โนวาคนเดียวทั้งใจ ❤️",
      "ขอบคุณที่เคียงข้างกันนะ",
      "จุ๊บๆ อ้วนๆของเค้า 💋",
      "RAK MAK MAK"
    ];

    const colors = ['#ff2e63', '#ff758c', '#ff7eb3', '#ffffff', '#ffb6c1', '#e056fd', '#ff9ff3'];
    const isMobile = window.innerWidth < 600;

    // สร้างคำกระจายรอบๆ พื้นหลัง
    function createAmbientWords() {
      const count = isMobile ? 22 : 40;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'ambient-item';
        el.innerText = ambientPhrases[Math.floor(Math.random() * ambientPhrases.length)];
        
        el.style.left = Math.random() * 90 + 5 + 'vw';
        el.style.top = Math.random() * 90 + 5 + 'vh';
        el.style.fontSize = (Math.random() * 0.5 + 0.6) + 'rem';
        el.style.color = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (Math.random() * 3 + 2) + 's';
        el.style.animationDelay = (Math.random() * 2) + 's';

        ambientContainer.appendChild(el);
      }
    }

    // คำนวณพิกัดรูปหัวใจ
    function getHeartPosition(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      return { x: x * scale, y: y * scale };
    }

    const wordsElements = [];
    const baseScale = isMobile ? (window.innerWidth * 0.02) : 17;

    const layers = [
      { total: 32, scale: baseScale * 0.75 },
      { total: 42, scale: baseScale * 1.15 }
    ];

    let phraseIndex = 0;
    layers.forEach((layer) => {
      for (let i = 0; i < layer.total; i++) {
        const el = document.createElement('div');
        el.className = 'heart-text';
        el.innerText = heartPhrases[phraseIndex % heartPhrases.length];
        phraseIndex++;

        el.style.fontSize = (isMobile ? 0.65 : 0.85) + 'rem';
        
        const t = (i / layer.total) * Math.PI * 2;
        const pos = getHeartPosition(t, layer.scale);
        
        el.dataset.targetX = pos.x;
        el.dataset.targetY = pos.y;
        el.dataset.layerScale = layer.scale;
        el.dataset.layerTotal = layer.total;
        el.dataset.layerIndex = i;

        heartContainer.appendChild(el);
        wordsElements.push(el);
      }
    });

    // รันอนิเมชันวนหัวใจ 3 รอบ
    function runHeartAnimation() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const totalTime = 8000;
      const startTime = performance.now();

      function animate(time) {
        const elapsed = time - startTime;
        const progress = elapsed / totalTime;

        if (progress < 1) {
          const offset = progress * Math.PI * 6;

          wordsElements.forEach((el) => {
            const index = parseFloat(el.dataset.layerIndex);
            const total = parseFloat(el.dataset.layerTotal);
            const scale = parseFloat(el.dataset.layerScale);

            const t = ((index / total) * Math.PI * 2) + offset;
            const pos = getHeartPosition(t, scale);

            el.style.left = (centerX + pos.x) + 'px';
            el.style.top = (centerY + pos.y) + 'px';
            el.style.color = colors[Math.floor((index + progress * 10) % colors.length)];
            el.style.opacity = Math.min(progress * 4, 1);
          });

          requestAnimationFrame(animate);
        } else {
          collapseAndExplode(centerX, centerY);
        }
      }

      requestAnimationFrame(animate);
    }

    // ดูดรวมเข้าศูนย์กลาง
    function collapseAndExplode(cx, cy) {
      let duration = 350;
      let start = performance.now();

      function shrink(time) {
        let elapsed = time - start;
        let p = elapsed / duration;

        if (p < 1) {
          wordsElements.forEach((el) => {
            let tx = parseFloat(el.dataset.targetX);
            let ty = parseFloat(el.dataset.targetY);

            let currentX = cx + tx * (1 - p);
            let currentY = cy + ty * (1 - p);

            el.style.left = currentX + 'px';
            el.style.top = currentY + 'px';
            el.style.transform = `translate(-50%, -50%) scale(${1 - p})`;
          });
          requestAnimationFrame(shrink);
        } else {
          wordsElements.forEach(el => el.style.opacity = '0');
          createFireworks(cx, cy, true);

          setTimeout(() => {
            hint.style.opacity = '0.9';
            counterEl.style.opacity = '0.9';
          }, 800);
        }
      }

      requestAnimationFrame(shrink);
    }

    // สร้างพลุ
    function createFireworks(x, y, isBig = false) {
      const particleCount = isBig ? 90 : 25;

      if (isBig) {
        createPopText(x, y, "I LOVE YOU NOVA 💕");
      }

      for (let i = 0; i < particleCount; i++) {
        const spark = document.createElement('div');
        spark.className = 'spark';

        const size = Math.random() * (isBig ? 10 : 6) + 4;
        spark.style.width = size + 'px';
        spark.style.height = size + 'px';
        spark.style.left = x + 'px';
        spark.style.top = y + 'px';

        const color = colors[Math.floor(Math.random() * colors.length)];
        spark.style.backgroundColor = color;
        spark.style.boxShadow = `0 0 12px ${color}`;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * (isBig ? 300 : 130) + 40;
        const tx = Math.cos(angle) * speed + 'px';
        const ty = Math.sin(angle) * speed + 'px';

        spark.style.setProperty('--tx', tx);
        spark.style.setProperty('--ty', ty);

        document.body.appendChild(spark);

        setTimeout(() => {
          spark.remove();
        }, 1200);
      }
    }

    // เด้งคำบอกรักเมื่อจิ้ม
    function createPopText(x, y, customText = null) {
      const textElem = document.createElement('div');
      textElem.className = 'tap-pop-text';
      
      const text = customText || loveMessages[Math.floor(Math.random() * loveMessages.length)];
      textElem.innerText = text;

      textElem.style.left = x + 'px';
      textElem.style.top = y + 'px';
      textElem.style.color = colors[Math.floor(Math.random() * colors.length)];
      textElem.style.fontSize = (isMobile ? 1.3 : 1.8) + 'rem';

      document.body.appendChild(textElem);

      setTimeout(() => {
        textElem.remove();
      }, 1400);
    }

    // อัปเดตข้อความตัวนับ
    function updateCounterText() {
      if (currentUnlockedLevel < 3) {
        const target = tapTargets[currentUnlockedLevel];
        const remaining = target - tapCountInCurrentLevel;
        counterEl.innerText = `💖 บี๋ๆจิ้มอีก ${remaining} ทีนะ จะได้อ่านจดหมายที่${currentUnlockedLevel + 1}`;
      } else {
        counterEl.innerText = `🎁 บี๋ๆอ่านจดหมายครบหมดแล้ว! ✨`;
      }
    }

    // ระบบจิ้มหน้าจอ
    window.addEventListener('pointerdown', (e) => {
      if (isModalOpen) return;

      createFireworks(e.clientX, e.clientY, false);
      createPopText(e.clientX, e.clientY);

      tapCountInCurrentLevel++;

      // ตรวจสอบว่าจิ้มครบเป้าหมายของรอบปัจจุบันหรือยัง
      if (currentUnlockedLevel < 3 && tapCountInCurrentLevel >= tapTargets[currentUnlockedLevel]) {
        setTimeout(() => {
          showGiftModal();
        }, 400);
      } else {
        updateCounterText();
      }
    });

    // แสดงกล่องของขวัญ
    function showGiftModal() {
      isModalOpen = true;
      giftModal.style.display = 'flex';
      giftBox.style.display = 'block';
      giftHintText.style.display = 'block';
      letterCard.style.display = 'none';
      createFireworks(window.innerWidth / 2, window.innerHeight / 2, true);
    }

    // เปิดอ่านจดหมาย
    function openLetter() {
      giftBox.style.display = 'none';
      giftHintText.style.display = 'none';
      letterCard.style.display = 'block';

      switchLetter(currentUnlockedLevel);

      // ถ้าครบ 3 ฉบับแล้ว ให้โชว์เมนูเลือกสลับอ่าน
      if (currentUnlockedLevel >= 2) {
        letterNav.style.display = 'flex';
      }

      createFireworks(window.innerWidth / 2, window.innerHeight / 2, true);
    }

    // สลับอ่านจดหมายฉบับต่างๆ
    function switchLetter(index) {
      letterTitle.innerText = letters[index].title;
      letterBody.innerText = letters[index].body;

      // ไฮไลต์ปุ่มที่เลือก
      for (let i = 0; i < 3; i++) {
        const btn = document.getElementById(`nav-${i}`);
        if (btn) {
          if (i === index) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      }
    }

    // ปิดจดหมาย
    function closeModal() {
      giftModal.style.display = 'none';
      isModalOpen = false;

      // รีเซ็ตจำนวนการกดรอบถัดไป
      tapCountInCurrentLevel = 0;

      if (currentUnlockedLevel < 2) {
        currentUnlockedLevel++; // เพิ่มระดับจดหมายฉบับถัดไป
      } else {
        currentUnlockedLevel = 3; // ปลดล็อกครบแล้ว
      }

      updateCounterText();
    }

    window.onload = () => {
      createAmbientWords();
      runHeartAnimation();
      updateCounterText();
    };
  </script>
</body>
</html>
